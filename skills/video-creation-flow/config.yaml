# ============================================================
# video-creation-flow — ONE-TIME CONFIG
# Everything here is OPTIONAL. You can leave it all blank and
# still make a full motion-graphics video (with a free voice and
# no avatar). Fill a field only if you want that upgrade.
# Each line tells you exactly what to paste.
# ============================================================

voiceover:
  provider: "auto"             # "auto" = use ElevenLabs if a voice_id is set below, otherwise use the FREE fallback. Options: auto | elevenlabs | free | none
  # --- ElevenLabs (OPTIONAL — a paid, best-quality cloned voice) ---
  elevenlabs_voice_id: ""      # OPTIONAL. HERE you add YOUR ElevenLabs cloned-voice ID if you have one. Leave blank to skip ElevenLabs.
  elevenlabs_model: "eleven_multilingual_v2"  # Leave as is.
  elevenlabs_stability: 0.45   # Leave as is.
  elevenlabs_similarity: 0.85  # Leave as is.
  elevenlabs_style: 0.40       # Leave as is.
  elevenlabs_speaker_boost: true
  elevenlabs_speed: 1.1
  # --- Free fallback (NO account, NO API key needed) ---
  free_engine: "edge-tts"      # Used automatically when no ElevenLabs voice_id is set. edge-tts = Microsoft free neural voices (pip install edge-tts).
  free_voice: "en-US-GuyNeural" # Any free edge-tts voice name. Change to another language/voice if you like.
  # If you would rather record your own audio, drop a file at <engine.local_dir>\assets\vo.mp3 and set provider: none (the flow will just use that file).

avatar:
  enabled: "auto"              # "auto" = add HeyGen avatar circles ONLY if heygen_avatar_id is set below; otherwise the video is made WITHOUT any avatar. Options: auto | on | off
  # --- HeyGen (OPTIONAL — talking avatar circles in the corner) ---
  heygen_avatar_id: ""         # OPTIONAL. HERE you add YOUR HeyGen avatar ID. Leave blank to make the video with NO avatar.
  heygen_engine: "avatar_iii"  # Leave as is.
  circle_px: 360               # Size of the avatar circle in the final video.

engine:
  local_dir: ""                # HERE you add the FULL path on YOUR machine to the working engine folder that holds build.mjs + DESIGN.md, e.g. C:\Users\you\HyperFrames\exp-v9  (copy the two files from this skill's engine/ folder into it; the baked audio lands at <local_dir>\assets\vo.mp3)
  design_md_drive_url: ""      # OPTIONAL. Google Drive link to your DESIGN.md, if you keep a copy in Drive. The file also ships in engine/.

music:
  bgm_ceiling_percent: 10      # MAX background-music volume. Never above 10. Lower for a quieter bed (1 to 3 is common). Set 0 for no music.

delivery:
  drive_folder_url: ""         # OPTIONAL. Google Drive folder link where finished videos + project files get uploaded. Leave blank to keep everything local.
